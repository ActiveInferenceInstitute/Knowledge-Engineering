name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Both jobs run the repository gate entry point, `.github/scripts/gate.py`, so
# the arm bodies live in that script and not in this workflow. Each job keeps
# its existing name because these job names are the status checks on `main`.
#
# The conformance job reads `.github/gnn-pin.json` (schema
# `gnn-importer-pin/v1`); `docs/RUN_GUIDE.md` documents the arms, job commands
# and pins, and `.github/GNN.md` the conformance semantics.

jobs:
  docs-and-scripts:
    name: docs and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Gate — links, Python syntax, notebooks, checkpoints, gate tests
        run: python .github/scripts/gate.py fast

  gnn-conformance:
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Gate — install and verify the pinned GNN parser
        run: python .github/scripts/gate.py gnn --install
