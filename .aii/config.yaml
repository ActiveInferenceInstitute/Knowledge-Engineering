# AII sidecar — InstituteOS metadata. Schema: aii_platform.aii_sidecar
meta:
  sidecar_version: 1.2.1
  updated: '2026-11-11'
repo:
  name: Knowledge-Engineering
  slug: knowledge-engineering
  full_name: ActiveInferenceInstitute/Knowledge-Engineering
  description: Public research-data and exploratory tooling archive for literature
    analysis, PubMed queries, PDF keyword extraction, ResearchRabbit exports, and
    an active-inference ontology snapshot.
institute:
  category: research
  maturity: released
  steward: Active Inference Institute
ecosystem:
  relations:
  - repo: ActiveInferenceInstitute/InstituteOS
    relation: referenced-by
    note: Federated via the InstituteOS .aii manifest.
  links:
    github: https://github.com/ActiveInferenceInstitute/Knowledge-Engineering
    website: https://www.activeinference.org
artifacts:
- path: README.md
  kind: doc
  description: Repository overview and documentation index.
- path: docs/index.md
  kind: doc
  description: Documentation hub (guides and reference map).
- path: docs/quickstart.md
  kind: doc
  description: Quickstart guide for the notebook and PDF tooling.
- path: docs/provenance.md
  kind: doc
  description: Dataset inventory and provenance notes.
- path: docs/architecture.md
  kind: doc
  description: Pipelines, module flow, and cross-area references.
- path: CONTRIBUTING.md
  kind: doc
  description: Public contribution and provenance guidance.
- path: CITATION.cff
  kind: metadata
  description: Machine-readable citation metadata.
- path: AGENTS.md
  kind: doc
  description: Repository conventions for automated contributors.
- path: Literature_Analysis/PDF_Scrape/README.md
  kind: doc
  description: PDF keyword extraction usage and limitations.
- path: Literature_Analysis/Pubmed_to_Coda/README.md
  kind: doc
  description: PubMed notebook usage and provenance.
- path: Literature_Analysis/ResearchRabbit/README.md
  kind: doc
  description: ResearchRabbit export inventory.
- path: Literature_Analysis/CitationSearch_PublishOrPerish/README.md
  kind: doc
  description: Publish-or-Perish export inventory.
- path: Ontology_Snapshot/README.md
  kind: doc
  description: Ontology snapshot inventory.
- path: LICENSE
  kind: doc
  description: License.
- path: docs
  kind: doc
  description: Documentation tree.
provenance:
  license: CC-BY-4.0
  citation:
    zenodo: https://doi.org/10.5281/zenodo.7449027
    text: Active Inference Institute — Knowledge-Engineering.
instituteos:
  tags:
  - knowledge-engineering
  - knowledge-graph
  - ontology
  - literature
  - jupyter
capabilities:
- notebooks
- documentation
- ci
- citation
tasks:
  inventory:
    cmd: git ls-files
    description: List tracked files.
  test:
    cmd: python .github/scripts/check_archive.py
    description: Run the dependency-free archive gate (links, syntax, notebooks).
docs:
- README.md
- AGENTS.md
- docs/INTEGRATION.md
- docs/README.md
- docs/AGENTS.md
schema: aii-sidecar/v1
